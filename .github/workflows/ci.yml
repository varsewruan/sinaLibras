name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Backend — pytest against a real MongoDB service container.
  # ---------------------------------------------------------------------
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        working-directory: backend
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: sinalibras_test
          JWT_SECRET: ci-test-secret-must-be-at-least-32-characters-long
          CORS_ORIGINS: http://test
          ENVIRONMENT: test
          LOG_LEVEL: WARNING
        run: python -m pytest -v --color=yes

  # ---------------------------------------------------------------------
  # Frontend — ensure the SPA still builds.
  # ---------------------------------------------------------------------
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Test
        working-directory: frontend
        env:
          CI: "true"
        # .env.test pins REACT_APP_BACKEND_URL so src/lib/env.js doesn't throw
        # at import time. Tests mock axios; the URL value is never actually used.
        run: yarn test --watchAll=false

      - name: Build
        working-directory: frontend
        env:
          # Boot validation in src/lib/env.js requires this; the value is
          # baked into the bundle at build time and overridden at runtime
          # by whatever the deploy environment provides.
          REACT_APP_BACKEND_URL: http://localhost:8000
          CI: "true"
        run: yarn build
