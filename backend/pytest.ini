[pytest]
asyncio_mode = auto
# Motor binds its client to the event loop where it was created. Forcing the
# whole suite onto a single session-wide loop means the session-scoped DB
# fixture and the function-scoped tests share one loop, so motor's futures
# never end up "attached to a different loop".
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
addopts = -ra --strict-markers
filterwarnings =
    ignore::DeprecationWarning:passlib.*
    ignore::DeprecationWarning:bson.*
