# =============================================================================
# Fly.io app config — SINALibras (single VM serving SPA + API)
# =============================================================================
# The actual app name is created interactively by `fly launch` and written
# here. Region "gru" = São Paulo, closest to Brazilian users.
# =============================================================================

app = "sinalibras"
primary_region = "gru"
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
  dockerfile = "Dockerfile.deploy"

[env]
  ENVIRONMENT = "production"
  LOG_LEVEL = "INFO"
  PORT = "8000"
  # The runtime image already exports FRONTEND_BUILD_DIR, but declaring it
  # here makes the contract explicit and easy to spot.
  FRONTEND_BUILD_DIR = "/app/static"
  # In prod, cookies must be over TLS — Fly terminates TLS at the edge.
  COOKIE_SECURE = "true"
  COOKIE_SAMESITE = "lax"

# Secrets (set with `fly secrets set …` — NEVER committed):
#   JWT_SECRET, MONGO_URL, DB_NAME, CORS_ORIGINS

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"   # scale to zero between requests (free tier friendly)
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
